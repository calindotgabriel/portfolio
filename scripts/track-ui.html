<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tracker antrenament</title>
<style>
  :root {
    --bg: #14140f; --panel: #1c1c16; --line: #33332a; --ink: #ece7d9;
    --dim: #948d7c; --accent: #d8cf9a; --warn: #e0a458; --ok: #8fbf72; --bad: #d1685e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim); margin: 32px 0 10px; font-weight: 600; }
  section { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 13px; }
  .plan { display: grid; gap: 8px; margin-bottom: 18px; }
  .plan div { display: grid; grid-template-columns: 96px 1fr; gap: 12px;
    padding: 9px 11px; background: #00000030; border-radius: 7px;
    border-left: 2px solid var(--line); }
  .plan b { color: var(--accent); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.05em; padding-top: 1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  input, textarea, select, button {
    font: inherit; color: var(--ink); background: #0f0f0b;
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 62px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { cursor: pointer; background: #26261d; width: auto; }
  button:hover { background: #323226; }
  button.primary { background: var(--accent); color: #1a1a12; border-color: var(--accent); font-weight: 600; }
  button.sm { padding: 4px 9px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .split { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line); }
  .split:last-child { border-bottom: 0; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .pill.due { border-color: var(--warn); color: var(--warn); }
  .pill.gap { border-color: var(--bad); color: var(--bad); }
  .done span { text-decoration: line-through; color: var(--dim); }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--dim); }
  .stats b { color: var(--ink); }
  .empty { color: var(--dim); font-size: 13px; padding: 10px 0; }
  .saved { font-size: 12px; color: var(--ok); opacity: 0; transition: opacity .2s; }
  .saved.on { opacity: 1; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tracker antrenament</h1>
    <div class="row">
      <input type="date" id="date" style="width:auto" />
      <span class="saved" id="saved">salvat</span>
    </div>
  </header>
  <div class="sub" id="dayline"></div>

  <h2>Azi</h2>
  <section>
    <div class="plan" id="plan"></div>
    <div class="grid">
      <div><label>Rezolvate în timp</label><input type="number" min="0" id="lc_solved" /></div>
      <div><label>Încercate</label><input type="number" min="0" id="lc_attempted" /></div>
      <div><label>Adâncime</label><input id="depth" placeholder="1 fișă" /></div>
      <div><label>Design</label><input id="design" placeholder="1" /></div>
      <div><label>Mock</label>
        <select id="mock"><option value="">—</option><option>coding</option><option>design</option></select>
      </div>
      <div><label>Aplicări</label><input type="number" min="0" id="applications" /></div>
      <div><label>Post-mortems</label><input type="number" min="0" id="postmortems" /></div>
    </div>
    <div style="margin-top:12px">
      <label>Notă — o propoziție. Ce s-a rupt, sau ce a mers neașteptat de bine.</label>
      <textarea id="note"></textarea>
    </div>
    <div class="stats" style="margin-top:14px" id="stats"></div>
  </section>

  <h2>Redo list</h2>
  <section>
    <div class="row" style="margin-bottom:14px">
      <input id="rp" placeholder="Problemă ratată" style="flex:2;min-width:180px;width:auto" />
      <input id="rc" placeholder="Categorie" style="flex:1;min-width:120px;width:auto" />
      <button class="primary" id="radd">Adaugă</button>
    </div>
    <div id="redo"></div>
  </section>

  <h2>Todo</h2>
  <section>
    <div class="row" style="margin-bottom:14px">
      <input id="tt" placeholder="Ce ai de făcut" style="flex:2;min-width:180px;width:auto" />
      <input type="date" id="td" style="width:auto" />
      <button class="primary" id="tadd">Adaugă</button>
    </div>
    <div id="todo"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const api = async (path, opts) => {
  const r = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  return r.status === 204 ? null : r.json();
};
const iso = (d) => { const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); };

const FIELDS = ["lc_solved","lc_attempted","depth","design","mock","applications","postmortems","note"];
let current = iso(new Date());
$("date").value = current;

function flash() { $("saved").classList.add("on"); setTimeout(() => $("saved").classList.remove("on"), 1200); }

async function loadDay() {
  const d = await api("/api/today?date=" + current);
  const plan = d.plan;
  $("dayline").textContent = plan
    ? `Ziua ${plan.day} din 48 · săptămâna ${plan.week} · ${plan.weekday} ${current}`
    : `${current} — zi liberă (curriculumul rulează ${d.span.a} → ${d.span.b})`;

  $("plan").innerHTML = plan
    ? [["10:00", plan.live_coding], ["11:45", plan.depth], ["13:30", plan.design]]
        .filter(([, v]) => v)
        .map(([t, v]) => `<div><b>${t}</b><span>${esc(v)}</span></div>`).join("")
    : `<div class="empty">Fără curriculum pentru ziua asta. Poți completa oricum jurnalul.</div>`;

  for (const f of FIELDS) $(f).value = d.log?.[f] ?? "";

  const c = d.counts;
  $("stats").innerHTML =
    `<span>Total rezolvate în timp <b>${c.solved}/${c.attempted}</b></span>` +
    `<span>Aplicări <b>${c.applications}</b></span>` +
    `<span>Post-mortems <b>${c.postmortems}</b></span>` +
    `<span>Zile în jurnal <b>${c.days}</b></span>`;
}

for (const f of FIELDS) {
  $(f).addEventListener("change", async () => {
    const body = {};
    for (const k of FIELDS) body[k] = $(k).value;
    await api("/api/log/" + current, { method: "PUT", body: JSON.stringify(body) });
    flash();
    loadDay();
  });
}

$("date").addEventListener("change", () => { current = $("date").value; loadDay(); });

async function loadRedo() {
  const d = await api("/api/redo");
  const dueIds = new Set(d.due.map((r) => r.id));
  const item = (r) => {
    const slot = r.result7 === null ? "7" : "21";
    const due = r.result7 === null ? r.due7 : r.due21;
    const isDue = dueIds.has(r.id);
    return `<div class="split">
      <div><span>${esc(r.problem)}</span>
        <div class="sub">${esc(r.category ?? "—")} · ratată ${r.missed_on}${r.resets ? " · resetări " + r.resets : ""}</div></div>
      <div class="row">
        <span class="pill ${isDue ? "due" : ""}">+${slot} · ${due}</span>
        <button class="sm" data-id="${r.id}" data-slot="${slot}" data-result="solved">rezolvată</button>
        <button class="sm" data-id="${r.id}" data-slot="${slot}" data-result="failed">ratată</button>
      </div></div>`;
  };

  $("redo").innerHTML =
    (d.due.length
      ? `<div class="sub" style="margin-bottom:6px">Scadente azi</div>` + d.due.map(item).join("")
      : `<div class="empty">Nimic scadent azi.</div>`) +
    (d.active.filter((r) => !dueIds.has(r.id)).length
      ? `<div class="sub" style="margin:16px 0 6px">Programate</div>` +
        d.active.filter((r) => !dueIds.has(r.id)).map(item).join("")
      : "") +
    (d.gaps.length
      ? `<div class="sub" style="margin:16px 0 6px">Goluri de fundament — tratează categoria, nu problema</div>` +
        d.gaps.map((r) => `<div class="split"><div><span>${esc(r.problem)}</span>
          <div class="sub">${esc(r.category ?? "—")}</div></div>
          <span class="pill gap">${r.resets} resetări</span></div>`).join("")
      : "") +
    (d.closed.length ? `<div class="sub" style="margin:16px 0 0">Închise: ${d.closed.length}</div>` : "");

  for (const b of $("redo").querySelectorAll("button[data-id]")) {
    b.onclick = async () => {
      await api(`/api/redo/${b.dataset.id}/result`, {
        method: "POST",
        body: JSON.stringify({ slot: b.dataset.slot, result: b.dataset.result }),
      });
      loadRedo();
    };
  }
}

$("radd").onclick = async () => {
  if (!$("rp").value.trim()) return;
  await api("/api/redo", { method: "POST", body: JSON.stringify({ problem: $("rp").value, category: $("rc").value }) });
  $("rp").value = ""; $("rc").value = "";
  loadRedo();
};

async function loadTodo() {
  const d = await api("/api/todo");
  const item = (t) => `<div class="split ${t.done ? "done" : ""}">
    <div class="row"><input type="checkbox" data-tid="${t.id}" ${t.done ? "checked" : ""} style="width:auto" />
      <span>${esc(t.text)}</span>${t.due ? `<span class="pill">${t.due}</span>` : ""}</div>
    <button class="sm" data-del="${t.id}">șterge</button></div>`;

  $("todo").innerHTML =
    (d.open.length ? d.open.map(item).join("") : `<div class="empty">Nimic în listă.</div>`) +
    (d.done.length ? `<div class="sub" style="margin:16px 0 6px">Făcute</div>` + d.done.map(item).join("") : "");

  for (const c of $("todo").querySelectorAll("input[data-tid]")) {
    c.onchange = async () => {
      await api("/api/todo/" + c.dataset.tid, { method: "PATCH", body: JSON.stringify({ done: c.checked }) });
      loadTodo();
    };
  }
  for (const b of $("todo").querySelectorAll("button[data-del]")) {
    b.onclick = async () => { await api("/api/todo/" + b.dataset.del, { method: "DELETE" }); loadTodo(); };
  }
}

$("tadd").onclick = async () => {
  if (!$("tt").value.trim()) return;
  await api("/api/todo", { method: "POST", body: JSON.stringify({ text: $("tt").value, due: $("td").value }) });
  $("tt").value = ""; $("td").value = "";
  loadTodo();
};

loadDay(); loadRedo(); loadTodo();
</script>
</body>
</html>
